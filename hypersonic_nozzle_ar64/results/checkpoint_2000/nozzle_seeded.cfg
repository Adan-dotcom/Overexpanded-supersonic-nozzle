%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Axisymmetric overexpanded hypersonic nozzle demonstration
% SU2 8.5.0, steady compressible RANS-SST
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V2003m, COMPRESSIBILITY-SARKAR
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
READ_BINARY_RESTART= NO
AXISYMMETRIC= YES

% Initial field and reference state
MACH_NUMBER= 0.01
AOA= 0.0
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_PRESSURE= 100000.0
FREESTREAM_TEMPERATURE= 300.0
FREESTREAM_TURBULENCEINTENSITY= 0.01
FREESTREAM_TURB2LAMVISCRATIO= 10.0
REF_DIMENSIONALIZATION= DIMENSIONAL

FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058

VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716E-5
MU_T_REF= 273.15
SUTHERLAND_CONSTANT= 110.4

CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
TURBULENT_CONDUCTIVITY_MODEL= CONSTANT_PRANDTL_TURB
PRANDTL_TURB= 0.90

% Chamber total conditions and ambient/back pressure: NPR = 20.
MARKER_HEATFLUX= ( WALL, 0.0 )
MARKER_SYM= ( AXIS )
MARKER_RIEMANN= ( INLET, TOTAL_CONDITIONS_PT, 2000000.0, 600.0, 1.0, 0.0, 0.0, \
                  OUTLET, STATIC_PRESSURE, 75000.0, 0.0, 0.0, 0.0, 0.0 )
MARKER_MONITORING= ( WALL )
MARKER_PLOTTING= ( WALL )

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 0.05
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.05, 0.02, 1.0 )
MAX_DELTA_TIME= 1E6

MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN_WANG
SLOPE_LIMITER_TURB= NONE
VENKAT_LIMITER_COEFF= 0.05

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 8

CONV_NUM_METHOD_FLOW= ROE
ENTROPY_FIX_COEFF= 0.1
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_REDUCTION_TURB= 0.5

ITER= 5000
CONV_RESIDUAL_MINVAL= -8
CONV_STARTITER= 100
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-7

MESH_FILENAME= nozzle_axisymmetric.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= restart_seed
CONV_FILENAME= history_ar64_pb75
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= wall
OUTPUT_FILES= ( RESTART, PARAVIEW_ASCII, SURFACE_PARAVIEW_ASCII, SURFACE_CSV )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
OUTPUT_WRT_FREQ= 500
HISTORY_WRT_FREQ_INNER= 1
SCREEN_WRT_FREQ_INNER= 20
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_ENERGY, RMS_TKE, RMS_DISSIPATION )
