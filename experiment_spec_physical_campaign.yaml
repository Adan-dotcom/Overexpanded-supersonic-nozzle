study: dlr_par_eilmer_validation_and_application
active_solver: Eilmer_5.0.0

campaigns:
  products_air_benchmark:
    status: screen_passed_not_training_eligible
    cells: [20000, 60000]
    mpi_ranks: 6
    target_wall_minutes: 30
    hard_stop_wall_minutes: 60
    training_eligible: false

  cold_n2_validation:
    gas: N2
    geometry: DLR_PAR
    geometry_screen: passed_not_flow_validation
    status: provisional_screen_authorized_missing_numeric_ambient_pressure
    stagnation_temperature_K: [285.0, 295.0, 305.0]
    ambient_pressure_Pa: null
    stagnation_pressure: derived_as_NPR_times_Pa
    wall_thermal: [adiabatic, fixed_280K, fixed_300K, fixed_320K]
    inlet_turbulence_intensity_fraction: [0.005, 0.01, 0.05]
    inlet_turbulence_length_scale_m: [0.0001, 0.001, 0.005]
    wall_material_or_thickness_used: false
    conjugate_heat_transfer: false
    x_sep_uncertainty_rt: 0.055
    training_eligible: false

  hot_methalox_application:
    geometry: DLR_PAR
    chamber_pressure_abs_pa: [5.10e6, 5.40e6]
    mixture_ratio_of: [3.10, 3.30]
    back_pressure_abs_pa: [5.00e4, 1.01325e5]
    npr: derived_as_Pc_over_Pa
    status: blocked_pending_hot_model_and_cold_n2_validation_gates
    training_eligible: false

acceptance:
  require_finite_positive_state: true
  relative_mass_imbalance_max: 0.005
  relative_total_energy_flux_imbalance_max: 0.01
  require_species_closure: true
  require_mesh_and_time_step_convergence: true
  require_turbulence_sensitivity: true
  require_experimental_anchor: true
