SOLVER= RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V2003m, COMPRESSIBILITY-SARKAR
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
READ_BINARY_RESTART= YES
AXISYMMETRIC= YES

MACH_NUMBER= 0.001
AOA= 0.0
INIT_OPTION= TD_CONDITIONS
