MESH_FILENAME= ../ambient_mesh/hybrid_pilot/dlr_par_hybrid.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= ../sensor_study/sea_level_hybrid_lut_screen/restart_continue
CONV_FILENAME= ../sensor_study/sea_level_hybrid_lut_screen/history_relax
RESTART_FILENAME= ../sensor_study/sea_level_hybrid_lut_screen/restart_relax
VOLUME_FILENAME= ../sensor_study/sea_level_hybrid_lut_screen/flow_relax
SURFACE_FILENAME= ../sensor_study/sea_level_hybrid_lut_screen/wall_relax
OUTPUT_FILES= ( RESTART, PARAVIEW_ASCII, SURFACE_CSV )
