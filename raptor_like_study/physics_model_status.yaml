schema_version: 2
updated_utc: "2026-09-20"
active_solver: Eilmer
accepted_training_labels: 0

policy:
  final_dataset_requires: physics_accepted_true
  npr_definition: Pc_over_Pa
  smoke_or_screen_can_be_label: false
  energy_gate: total_enthalpy_and_global_total_energy_flux

solver:
  version: 5.0.0
  commit: f53f4609a0331d48efee69a4e4f3c3598378cc03
  install_verified: true
  mpi_six_rank_verified: true
  multispecies_compiled: true
  multitemperature_compiled: true
  turbulence_compiled: true

tracks:
  products_air_benchmark:
    description: Small multicomponent exhaust/air software and conservation test.
    software_screening_enabled: true
    production_enabled: false
    target_wall_minutes: 30
    hard_stop_wall_minutes: 60
    blockers:
      - benchmark_case_not_implemented
      - methalox_species_set_not_selected
      - transport_model_not_checked

  cold_n2_validation:
    description: Published DLR-PAR cold-nitrogen validation lane.
    software_screening_enabled: false
    production_enabled: false
    blockers:
      - published_boundary_conditions_not_fully_digitized
      - eilmer_grid_not_generated
      - turbulence_model_not_qualified
      - experimental_separation_anchors_not_reproduced

  hot_methalox_products_air_plume:
    description: Synthetic DLR-PAR nozzle/plume with methalox exhaust and air.
    software_screening_enabled: false
    production_enabled: false
    blockers:
      - products_air_benchmark_not_passed
      - finite_rate_mechanism_not_selected_or_validated
      - thermodynamics_and_transport_not_validated_over_state_domain
      - turbulence_model_not_validated_for_separation
      - wall_thermal_model_not_justified
      - conservation_mesh_time_step_and_stationarity_gates_not_completed
      - no_experimental_hot_methalox_dlr_par_anchor_exists

required_before_any_physics_accepted_label:
  - solver_exit_success
  - finite_positive_state
  - species_mass_fraction_closure
  - mass_and_total_energy_conservation
  - consistent_thermochemical_reference
  - mesh_and_time_step_convergence
  - turbulence_model_sensitivity
  - justified_wall_thermal_model
  - experimental_anchor
