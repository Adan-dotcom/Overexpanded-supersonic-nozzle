study_name: nozzle_separation_sensor_minimum
geometry:
  source_format: csv_x_r_m
  profile_file: geometry_id.csv
  throat_x_m: 0.0
  axisymmetric: true

operating_envelope:
  chamber_pressure_pa: [5100000.0, 5400000.0]
  back_pressure_pa: [50000.0, 101325.0]
  mixture_ratio_of: [3.1, 3.3]
  chamber_temperature: CEA_derived
  npr: derived_as_Pc_over_Pa

gas:
  solver: Eilmer_5
  exterior: dry_air
  chamber_products: CEA_LOX_CH4
  chemistry_models: [equilibrium, frozen, finite_rate]
  species_file: null
  reaction_mechanism_file: null
  transport_model: null

wall:
  velocity_boundary: no_slip
  thermal_boundary: adiabatic
  sensitivity: fixed_temperature

solver:
  mpi_ranks: 6
  modes: [steady, transient]
  mesh_levels: [screen, pilot, medium, fine]
  turbulence_model: pending_qualification

sensors:
  candidate_measurements: [wall_static_pressure]
  noise_model: full_scale_error_plus_bias_plus_white_noise
  sensor_count_grid: [2, 3, 4, 6, 8, 12, 16, 24]
  layouts_file: sensor_layouts.template.csv

dataset:
  labels: [separated, x_sep_m, x_reattach_m, shock_x_m]
  final_filter: physics_accepted_true_only
  split_by: complete_cfd_case
