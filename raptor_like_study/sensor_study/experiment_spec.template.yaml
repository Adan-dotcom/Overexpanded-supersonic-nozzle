study_name: nozzle_separation_sensor_minimum
purpose: predict_boundary_layer_separation_from_sparse_transducers

geometry:
  source_format: csv_x_r_m
  profile_file: geometry_id.csv
  throat_x_m: 0.0
  axisymmetric: true
  ids: [bell_0001, bell_0002]

operating_envelope:
  # Replace these ranges with the actual facility or engine envelope.
  chamber_pressure_pa: [20000000.0, 30000000.0]
  chamber_temperature_k: [3000.0, 3900.0]
  back_pressure_pa: [5000.0, 101325.0]
  area_ratio: [20.0, 50.0]
  mass_flow_kg_s: null
  thrust_n: null

gas:
  regime: hot_fire # cold_flow or hot_fire
  oxidizer: O2(L)
  fuel: CH4(L)
  of_ratio: [3.2, 4.0]
  chemistry_model: [CEA_equilibrium, CEA_frozen]
  inlet_model: burned_gas_total_state
  # Use measured composition if available; otherwise CEA creates it.
  species_mass_fractions_file: null
  transport_model: Sutherland_effective

wall:
  thermal_boundary: fixed_temperature
  temperature_k: [500.0, 900.0]
  material: nickel_alloy
  emissivity: 0.8
  conjugate_heat_transfer: false

solver:
  code: SU2
  flow_models: [RANS_SST]
  unsteady_model: [steady, URANS]
  mesh_levels: [coarse, medium, fine]
  mpi_ranks: [1, 2, 4]
  iterations: 10000
  separation_definition: first_cf_t_zero_after_throat

sensors:
  candidate_measurements: [wall_static_pressure]
  optional_measurements: [wall_temperature, wall_heat_flux, accelerometer]
  noise_model: gaussian_plus_bias
  pressure_noise_fraction: 0.002
  pressure_bandwidth_hz: 10000.0
  sampling_rate_hz: 50000.0
  sensor_count_grid: [2, 3, 4, 6, 8, 12, 16, 24]
  layouts_file: sensor_layouts.template.csv

dataset:
  labels: [separated, x_sep_m, x_reattach_m, shock_x_m]
  split_by: geometry_and_operating_condition
  seed: 20260916
  minimum_converged_cases: 100
