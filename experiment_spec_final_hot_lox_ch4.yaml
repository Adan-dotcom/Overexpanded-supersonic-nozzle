study:
  name: dlr_par_lox_ch4_sparse_sensor_placement
  purpose: >
    Sparse fixed wall-pressure sensor placement for localization of shock-induced
    boundary-layer separation in an axisymmetric TOP nozzle using hot LOX/LCH4
    combustion products.

geometry:
  source_file: DLR_PAR_full_contour.csv
  type: axisymmetric_TOP
  throat_x_m: 0.0
  throat_radius_m: 0.010
  exit_x_m: 0.12502
  exit_radius_m: 0.05477
  area_ratio_Ae_At: 30.0
  variants: [DLR_PAR]
  provenance: "Frey dissertation, Appendix B Fig. B.3; reconstructed full contour supplied by user"

operating_conditions:
  # NASA LOX/CH4 hot-fire envelope, not claimed to be Raptor data.
  chamber_pressure_abs_Pa:
    min: 5.10e6
    max: 5.40e6
    nominal: 5.20e6
    source_basis: "NASA MSFC 31-kN LOX/CH4 hot-fire campaigns (HR-1/LLAMA family)"
  mixture_ratio_OF:
    min: 3.10
    max: 3.60
    nominal: 3.20
    source_basis: "NASA MSFC 31-kN LOX/CH4 hot-fire campaigns"
  nozzle_pressure_ratio:
    min: 20.0
    max: 100.0
    sampling: latin_hypercube
    rationale: "study design variable chosen to span strongly overexpanded through weakly-overexpanded/attached regimes"
  back_pressure_Pa:
    definition: "Pc_abs / NPR"
    implied_min_approx: 5.10e4
    implied_max_approx: 2.70e5
  chamber_temperature_K:
    definition: "derived by NASA CEA v3 for each (Pc,O/F) case; not independently sampled"
  mass_flow_kg_s:
    definition: "derived from choked solution / CEA-consistent chamber state and throat area; not imposed"
  thrust_N:
    definition: "derived output; NASA 31-kN thrust is NOT imposed because the DLR-PAR throat area is different"

thermochemistry:
  propellants:
    oxidizer: LOX
    fuel: LCH4
  chemistry_primary: equilibrium
  code: NASA_CEA_v3
  chamber_state: equilibrium
  nozzle_expansion_primary: equilibrium
  model_form_sensitivity:
    - frozen_CEA
  finite_rate:
    enabled: false
    reason: >
      Current stock SU2 NEMO finite-rate gas models do not include an out-of-the-box
      LOX/CH4 combustion-products mechanism. Do not claim finite-rate methane chemistry
      in SU2 unless a validated custom mechanism is implemented.
  cfd_property_coupling:
    method: "CEA-generated variable-property table -> SU2 compressible data-driven fluid model"
    independent_variables: [rho, e]
    required_outputs: [p, T, a, cp, cv, mu, k]
  note: >
    Recent methane-nozzle literature reports finite-rate chemistry gives the best
    agreement, but equilibrium and finite-rate results are close for high-pressure
    Raptor-class conditions; frozen chemistry is retained as a sensitivity bound.

wall:
  velocity_bc: no_slip
  thermal_bc_primary: adiabatic
  material: null
  conjugate_heat_transfer: false
  radiation: false
  rationale: >
    Fluid-only separation/sensor study on the DLR-PAR contour. No cooling-channel
    geometry or experimentally supported hot-wall temperature exists for this
    synthetic DLR-PAR + NASA LOX/LCH4 combination, so a material/CHT model would
    require invented hardware data.

cfd:
  code: SU2
  version_target: "8.5.x or current stable"
  dimensionality: 2D_axisymmetric
  governing_equations: compressible_RANS_URANS_Navier_Stokes
  primary_solver: RANS
  unsteady_subset_solver: URANS
  turbulence_primary: SST_2003m
  turbulence_model_uncertainty:
    alternate: Spalart_Allmaras
    duplicate_cases: 10
  convection:
    scheme: HLLC
    spatial_order: second_order_MUSCL
    limiter: Venkatakrishnan
  viscous_gradients: weighted_least_squares
  time:
    steady: implicit
    unsteady: dual_time_BDF2
  wall_resolution:
    target_y_plus_max: 1.0
    boundary_layer_resolved: true
  mesh:
    generator: Gmsh_or_equivalent
    topology_preference: quad_dominant_structured_near_wall
    grid_convergence:
      enabled: true
      levels: [coarse, medium, fine]
      representative_cases: 6
  outputs:
    - wall_pressure
    - wall_shear_stress
    - skin_friction_coefficient
    - Mach
    - density
    - temperature
    - velocity
    - turbulence_variables

dataset:
  production_cases: 100
  sampling: latin_hypercube
  sampled_dimensions:
    - chamber_pressure_abs_Pa
    - mixture_ratio_OF
    - nozzle_pressure_ratio
  extra_runs:
    turbulence_model_duplicates: 10
    grid_convergence_additional_runs: 12
  total_planned_cfd_runs: 122
  split_unit: complete_CFD_case
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  leakage_rule: >
    All sensor layouts/noise realizations derived from the same CFD case remain
    in the same split.

separation_truth:
  separated_flag:
    definition: "true if a persistent post-throat Cf sign reversal exists"
  x_sep:
    definition: >
      first post-throat axial location where wall Cf crosses from positive to negative,
      linearly interpolated between adjacent wall samples and required to remain negative
      over a persistence interval
  x_reattach:
    definition: >
      first downstream persistent crossing of Cf from negative back to positive
  x_shock:
    definition: "location of maximum resolved wall-pressure gradient, stored separately from x_sep"
  additional_targets:
    - separation_bubble_length
    - min_Cf
    - mean_wall_pressure
    - wall_pressure_RMS_for_URANS_cases

sensors:
  primary_variable: wall_static_pressure
  installation_model: flush_mounted
  reference_hardware:
    manufacturer: Kulite
    model_family: HEM_375_CO
    selected_full_scale_bar: 70
    accuracy_max_percent_FSO: 0.5
    natural_frequency_Hz_min: 400000
    operating_temperature_C_max: 193
    note: >
      Hardware reference is used only to define pressure/noise/dynamic limits for
      virtual sensors; actual hot-wall installation would require thermal isolation/cooling.
  virtual_sensor_candidates:
    region: "divergent wall only: x > 0"
    coordinate_source: DLR_PAR_full_contour.csv
    candidate_count: 128
    placement: "arc-length-uniform resampling of the divergent wall"
  max_sensor_counts_to_test: [2, 3, 4, 5, 6, 8, 10, 12, 16, 24]
  noise_model:
    static_gain_error_percent_FSO: 0.5
    zero_offset_realizations: true
    additive_white_noise: true
  dynamic_model_URANS:
    sensor_bandwidth_Hz: 400000
    sampling_rate_Hz: 1000000
  optimization_constraint:
    fixed_layout_across_all_operating_conditions: true

ml:
  task_1:
    type: classification
    target: separated_flag
  task_2:
    type: regression
    target: x_sep
    active_when: separated_flag_true
  baselines:
    - uniform_spacing
    - random_fixed_layout
    - greedy_forward_selection
    - POD_QR
  learned_model:
    type: MLP_or_1D_encoder
  metrics:
    classification: [F1, AUROC, false_negative_rate]
    localization: [MAE_x_over_L, RMSE_x_over_L, P95_abs_error]
  sensor_budget_curve: true
