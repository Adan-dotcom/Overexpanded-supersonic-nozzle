study:
  name: dlr_par_methalox_sparse_sensor_eilmer
  purpose: predict shock-induced boundary-layer separation from sparse wall pressure
  status: blocked_pending_hot_model_and_validation_gates
  claim_scope: synthetic_methodology_study_not_raptor_hardware

geometry:
  source_file: DLR_PAR_full_contour.csv
  source_status: user_reconstruction_scalar_controls_corroborated_not_full_cad
  type: axisymmetric_TOP
  throat_x_m: 0.0
  throat_radius_m: 0.010
  exit_x_m: 0.12502
  exit_radius_m: 0.05477
  area_ratio: 30.0
  variants: [DLR_PAR]
  arbitrary_geometry_claim_allowed: false

operating_conditions:
  chamber_pressure_abs_pa: {min: 5.10e6, max: 5.40e6, nominal: 5.20e6}
  mixture_ratio_of: {min: 3.10, max: 3.30, nominal: 3.20}
  back_pressure_abs_pa: {min: 5.00e4, max: 1.01325e5}
  chamber_temperature: NASA_CEA_derived_per_case
  nozzle_pressure_ratio: derived_as_Pc_over_Pa
  independently_sample_npr: false

thermochemistry:
  chamber_reference: NASA_CEA_v3.3.4
  oxidizer: O2_L
  fuel: CH4_L
  eilmer_primary_candidate: thermally_perfect_multispecies_finite_rate
  comparison_models: [equilibrium, frozen, finite_rate]
  exhaust_species_set: [H2O, CO2, CO, H2, OH, O2, O, H]
  species_set_basis: products_air_screen_only_pending_finite_rate_mechanism
  exterior_composition: dry_air
  transport_model: thermally_perfect_fick_binary_screened_pending_hot_validation
  chemical_reference_state_must_be_consistent: true

solver:
  code: Eilmer
  version: 5.0.0
  mpi_ranks: 6
  dimensionality: 2D_axisymmetric
  flow: compressible_viscous
  turbulence_primary_candidate: k_omega
  turbulence_alternates: pending_supported_model_review
  transient_method: explicit_or_implicit_after_benchmark
  output_format: VTK

mesh:
  near_wall: structured_wall_normal_layers
  target_y_plus: 1.0
  levels: [screen, pilot, medium, fine]
  shock_and_throat_refinement: true
  generated_files_committed: false

wall:
  velocity: no_slip
  thermal_primary: adiabatic
  required_sensitivity: fixed_temperature_or_heat_flux
  conjugate_heat_transfer: false
  rationale: no_supported_cooling_channel_geometry_or_hot_wall_measurement

benchmark:
  type: compressible_multicomponent_products_air
  target_cells: [20000, 60000]
  target_wall_minutes: 30
  hard_stop_wall_minutes: 60
  required_checks:
    - finite_positive_state
    - species_mass_fraction_closure
    - mass_flux_closure
    - total_energy_flux_closure
    - separate_exhaust_and_air_boundary_compositions
    - vtk_export

separation_truth:
  x_sep: first_post_throat_wall_shear_positive_to_negative_crossing
  persistence_m_min: 0.001
  x_reattach: first_persistent_negative_to_positive_crossing
  x_shock: maximum_wall_pressure_gradient
  urans_statistics: [mean, standard_deviation, distribution]

sensors:
  variable: wall_static_pressure
  installation: flush_mounted
  candidate_count: 128
  sensor_count_grid: [2, 3, 4, 5, 6, 8, 10, 12, 16, 24]
  candidate_ranges_bar: [17, 35, 70]
  layouts_fixed_using_training_fold_only: true

dataset:
  final_filter: physics_accepted_true_only
  split_group: complete_CFD_case
  validation: grouped_nested_cross_validation
  accepted_labels_current: 0
